name: Request AI regression tests

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "**/*.py"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.java"
      - "!tests/**"
      - "!**/test_*.py"
      - "!**/*.test.js"
      - "!**/*.spec.js"
      - "!**/*Test.java"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify-generator:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Sign and deliver the GitHub push event
        env:
          GENERATOR_API_URL: ${{ secrets.GENERATOR_API_URL }}
          GENERATOR_WEBHOOK_SECRET: ${{ secrets.GENERATOR_WEBHOOK_SECRET }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          if [ -z "$GENERATOR_API_URL" ] || [ -z "$GENERATOR_WEBHOOK_SECRET" ]; then
            echo "Set GENERATOR_API_URL and GENERATOR_WEBHOOK_SECRET repository secrets."
            exit 1
          fi
          SIGNATURE=$(python - <<'PY'
          import hashlib, hmac, os
          body = open(os.environ["GITHUB_EVENT_PATH"], "rb").read()
          print("sha256=" + hmac.new(os.environ["GENERATOR_WEBHOOK_SECRET"].encode(), body, hashlib.sha256).hexdigest())
          PY
          )
          curl --fail-with-body --silent --show-error \
            --max-time 60 \
            -X POST "${GENERATOR_API_URL%/}/webhook/github" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-Hub-Signature-256: $SIGNATURE" \
            --data-binary "@$GITHUB_EVENT_PATH"
