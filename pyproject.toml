[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/generated"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["tests/generated"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]
include = "\\.pyi?$"
